name: Build AI Export Fixer Pro

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check project
        shell: pwsh
        run: |
          if (!(Test-Path "src/DPIFix.App/DPIFix.App.csproj")) {
            Write-Error "Application project file is missing."
            exit 1
          }

      - name: Build Windows application
        run: dotnet publish src/DPIFix.App/DPIFix.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/AIExportFixerPro-win-x64

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: AIExportFixerPro-win-x64
          path: artifacts/AIExportFixerPro-win-x64/
          if-no-files-found: error
